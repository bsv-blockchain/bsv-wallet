appId: org.bsvblockchain.wallet
---
- runFlow: ../subflows/launch-fresh.yaml
- runFlow: ../subflows/create-via-pay.yaml
- tapOn:
    id: pay-back
- runFlow: ../subflows/dismiss-backup-reminder.yaml
# External pairing consent. Reject, so nothing tries to open a relay.
- openLink: bsv-wallet://pair?topic=e2e-topic-0001&backendIdentityKey=0215643bc656ca42007faa32e94f70050f64a566ffd9e3a2ebc098389936dea57e&protocolID=1-e2e&origin=https%3A%2F%2Fe2e.example&expiry=2000000000
- extendedWaitUntil:
    visible: Connect Wallet
    timeout: 20000
- assertVisible:
    id: pair-approve
- assertVisible:
    id: pair-reject
- assertVisible:
    id: pair-origin
- tapOn:
    id: pair-reject
- extendedWaitUntil:
    visible:
      id: e2e-harness
    timeout: 20000
# BRC-100 style connection sheet. The in-app browser is not in this repo;
# the harness route raises the same PermissionSheet the bridge uses.
- openLink: bsv-wallet://e2e-consent
- extendedWaitUntil:
    visible:
      id: bridge-deny
    timeout: 20000
- assertVisible:
    id: bridge-approve
- assertVisible:
    id: bridge-connect-origin
- assertVisible: "Don't connect"
- tapOn:
    id: bridge-deny
- extendedWaitUntil:
    notVisible:
      id: bridge-deny
    timeout: 15000
# A retired payments link still opens Pay.
- openLink: bsv-wallet://payments
- extendedWaitUntil:
    visible:
      id: pay-back
    timeout: 20000
- tapOn:
    id: pay-back
# An external import link must not open the restore form.
- openLink: bsv-wallet://auth/mnemonic?flow=import
- extendedWaitUntil:
    visible:
      id: e2e-harness
    timeout: 20000
- assertNotVisible:
    id: import-mnemonic-input
# A payment link opens Pay rather than a browser.
- openLink: peerpay:e2e
- extendedWaitUntil:
    visible:
      id: pay-back
    timeout: 20000
