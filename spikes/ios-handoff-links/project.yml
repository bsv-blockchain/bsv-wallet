name: HandoffSpike
options:
  bundleIdPrefix: tech.bsvb.spike
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
targets:
  HandoffSpike:
    type: application
    platform: iOS
    sources: [App]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tech.bsvb.spike.handoff
        CODE_SIGN_ENTITLEMENTS: App/App.entitlements
    info:
      path: App/Info.plist
      properties:
        CFBundleURLTypes:
          - CFBundleURLName: spike
            CFBundleURLSchemes: [bsvbridgespike]
        NSFaceIDUsageDescription: Approve spike
        UILaunchScreen: {}
    dependencies:
      - target: HandoffExt
        embed: true
  HandoffExt:
    type: app-extension
    platform: iOS
    sources:
      - Ext/SafariWebExtensionHandler.swift
      - path: Ext/Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tech.bsvb.spike.handoff.Extension
        CODE_SIGN_ENTITLEMENTS: Ext/Ext.entitlements
        ENABLE_DEBUG_DYLIB: NO
    info:
      path: Ext/Info.plist
      properties:
        CFBundleDisplayName: Handoff Spike Ext
        NSExtension:
          NSExtensionPointIdentifier: com.apple.Safari.web-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).SafariWebExtensionHandler
