# Requests, the asked side (run while requests-ask.yaml waits): the request
# arrives within a poll, opens with its note, and is declined.
appId: com.bitcoinsv.wallet
---
- openLink: bitcoinsv-wallet://activity
# iOS's "Open in…?" alert, when it shows: Activity isn't up behind it yet
- runFlow:
    when:
      platform: iOS
      notVisible: Requested
    commands:
      - tapOn:
          point: 68%,54%
- extendedWaitUntil:
    visible: .*Waiting · Lunch on Friday.*
    timeout: 60000
- tapOn: .*Waiting · Lunch on Friday.*
- assertVisible: Lunch on Friday
- tapOn: Decline
- assertVisible: You declined it
