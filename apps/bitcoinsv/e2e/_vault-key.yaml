# One key in the core's enrolment wizard: its PIN twice (the fields carry no
# label of their own, so by position), then its recovery code written down.
appId: com.bitcoinsv.wallet
---
- extendedWaitUntil:
    visible: Choose a PIN
    timeout: 10000
- tapOn:
    point: 50%,45%
- inputText: ${PIN}
- tapOn:
    point: 50%,56%
- inputText: ${PIN}
- tapOn: Step 1 of 3
- tapOn: Continue
- extendedWaitUntil:
    visible: ".*I have written this down"
    timeout: 20000
- tapOn: ".*I have written this down"
- tapOn: Continue
- extendedWaitUntil:
    visible: Add another key\?
    timeout: 20000
