# Encrypt & sync (decision 2: the prototype's steps, saving a placeholder):
# password manager, 1Password, a password, connect, and the plain "not
# available yet". Nothing is saved or recorded as backed up. Starts on Home.
appId: com.bitcoinsv.wallet
---
- tapOn: Settings
- tapOn: "Backups, .*"
- assertVisible: Four ways to back up
- tapOn: Got it, I’ll keep my backup safe
# the button, not its explainer chip at the top
- tapOn:
    text: Encrypt & sync
    below: Got it, I’ll keep my backup safe
- assertVisible: We lock your backup with a password.*
- takeScreenshot: encrypt-choose
- tapOn: Password manager
- tapOn: What is a password manager\?
- assertVisible: One app, all your passwords
# put the explainer away: dragged down on iOS, Android's back key
- runFlow:
    when:
      platform: iOS
    commands:
      - swipe:
          start: 50%,40%
          end: 50%,95%
- runFlow:
    when:
      platform: Android
    commands:
      - back
- tapOn: 1Password
- tapOn: Password
# no double "r": two R key presses reload a development build on Android
- inputText: "Brave-Otter-92"
- tapOn: Repeat password
- inputText: "Brave-Otter-92"
- assertVisible: Strong
- takeScreenshot: encrypt-password
- tapOn: Protect the backup
- tapOn: Continue
- assertVisible: Connect 1Password
# the sheet's title, the heading and the button all say it: the button is last
- tapOn:
    text: Connect 1Password
    index: 2
- extendedWaitUntil:
    visible: Not available yet
    timeout: 5000
- assertVisible: .*Nothing was saved.*
- takeScreenshot: encrypt-unavailable
- tapOn: Back up another way
- assertVisible: Four ways to back up
