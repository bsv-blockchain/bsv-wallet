# Scan to sign in: from Home's scan button, the intro and its "what is
# Sign in with Web3?" sheet, then Settings → Sign-ins. (A website's own code,
# and the review and refusal it leads to, need a live pairing code; the
# reading of one is unit-tested in __tests__/signIn.test.ts.) Starts on Home.
appId: com.bitcoinsv.wallet
---
- tapOn: Scan to sign in
- assertVisible: Scan a website’s sign-in code
- tapOn: What is Sign in with Web3?
- assertVisible: No password, just your wallet
- takeScreenshot: sign-in-about
- swipe:
    start: 50%,40%
    end: 50%,95%
- openLink: bitcoinsv-wallet://sign-ins
- runFlow:
    when:
      platform: iOS
      notVisible: Sign-ins
    commands:
      - tapOn:
          point: 68%,54%
- assertVisible: Sign-ins
- assertVisible: Sign in to a website
