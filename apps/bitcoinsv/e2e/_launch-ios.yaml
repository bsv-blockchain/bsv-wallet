# Start the development build on the iOS simulator. A cold launch reloads the
# last Metro bundle; opening the dev-client link into a running app reloads JS
# in place, which can crash Expo's native views in development (see
# docs/superpowers/2026-10-09-now-app-motion.md), so the link is used only
# when the launcher shows (first run).
appId: org.bsvblockchain.wallet
---
- launchApp:
    stopApp: true
- runFlow:
    when:
      visible: (Development servers|Enter URL manually|DEVELOPMENT SERVERS)
    commands:
      - openLink: exp+bsv-wallet://expo-development-client/?url=http%3A%2F%2Flocalhost%3A8081
      # the system's "Open in Bitcoin SV Wallet?" alert, outside the app's tree
      - tapOn:
          point: 68%,54%
# the dev client's menu can open over the app on launch
- runFlow:
    when:
      visible: Toggle performance monitor
    commands:
      - tapOn:
          point: 50%,12%
- extendedWaitUntil:
    visible:
      text: (Continue|Get set up|Total balance.*)
    timeout: 60000
# the dev client explains its menu over the app on a first run, once the
# bundle has loaded
- extendedWaitUntil:
    visible: This is the developer menu.*
    timeout: 3000
    optional: true
- runFlow:
    when:
      visible: This is the developer menu.*
    commands:
      - tapOn: Continue
      - runFlow:
          when:
            visible: Toggle performance monitor
          commands:
            - tapOn:
                point: 50%,12%
