# Push routing, before Firebase: a development build with
# EXPO_PUBLIC_PUSH_SIMULATE=true plays pushes (app/dev-push.tsx). A tapped
# request push opens Activity on Requested; a tapped payment push, on All.
# Starts on Home.
appId: com.bitcoinsv.wallet
---
- tapOn: Settings
- scrollUntilVisible:
    element: Push simulator
- tapOn: Push simulator
- assertVisible: REQUESTS.*
- tapOn:
    text: Notification tapped
    index: 1
- extendedWaitUntil:
    visible: Activity
    timeout: 8000
- assertVisible:
    text: Requested
    selected: true
- tapOn:
    point: 8%,10%
- tapOn:
    text: Notification tapped
    index: 0
- extendedWaitUntil:
    visible: Activity
    timeout: 8000
