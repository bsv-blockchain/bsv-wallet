# Help from Home's top bar (quick answers, one opened), then Import wallet's
# backup file placeholder (decision 2). Starts on Home.
appId: org.bsvblockchain.wallet
---
- tapOn: Help & support
- assertVisible: QUICK ANSWERS
- tapOn: Is my money safe\?
- assertVisible: Only you hold the keys to your wallet.*
- takeScreenshot: help
- runFlow:
    when:
      platform: iOS
    commands:
      - swipe:
          start: 50%,40%
          end: 50%,95%
- runFlow:
    when:
      platform: Android
    commands:
      - back
- tapOn: Your wallets
- tapOn: Import wallet
- tapOn: I have a backup file
- assertVisible: Backup files come later
- tapOn: Use my phrase or slices
- assertVisible: Bring your wallet back
