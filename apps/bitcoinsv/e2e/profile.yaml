# Your profile from Settings: the picture (a new animal), the handle, the
# rows for this wallet. Starts on Home.
appId: org.bsvblockchain.wallet
---
- tapOn: Settings
- tapOn: ".*Your profile"
- assertVisible: Your pay code.*
- assertVisible: "Backup phrase, .*"
- takeScreenshot: profile
- tapOn: Edit picture
- assertVisible: Profile photo
- takeScreenshot: profile-photo
- tapOn:
    text: "Choose the .*"
    index: 2
- takeScreenshot: profile-updated
