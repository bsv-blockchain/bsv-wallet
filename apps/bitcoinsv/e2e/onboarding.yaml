# Welcome's three screens, then the first wallet with a free @handle.
# Run on a fresh install (no wallet). Ends on Home, not yet backed up.
appId: com.bitcoinsv.wallet
---
- extendedWaitUntil:
    visible: No crypto skills needed
    timeout: 60000
- tapOn: Continue
- tapOn: Continue
- tapOn: Got it
- extendedWaitUntil:
    visible: Create wallet
    timeout: 15000
- takeScreenshot: onboarding-create
- tapOn: Create wallet
- extendedWaitUntil:
    visible: Get set up
    timeout: 180000
# a new wallet is never born backed up
- assertVisible: 0 of 2
- assertVisible:
    text: Back up this wallet
    checked: false
- takeScreenshot: onboarding-home
