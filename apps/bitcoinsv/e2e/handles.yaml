# Settings → Handles: what each wallet goes by, free, copied on a tap; and a
# search that lands on its row in Settings, lit. Starts on Home.
appId: com.bitcoinsv.wallet
---
- tapOn: Settings
- tapOn: Handles.*
- assertVisible: IN USE
- assertVisible: OWNED
- assertVisible: No bought handles
- takeScreenshot: handles
- openLink: bitcoinsv-wallet://activity
- runFlow:
    when:
      platform: iOS
      notVisible: Requested
    commands:
      - tapOn:
          point: 68%,54%
- tapOn: Search payments
- inputText: export
- assertVisible: SETTINGS
- tapOn:
    text: Export for accounting
    index: 0
- assertVisible: Export for accounting.*
- takeScreenshot: search-lands-lit
