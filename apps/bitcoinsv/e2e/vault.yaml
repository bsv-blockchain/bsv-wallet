# Vault (development builds), on a wallet with no vault and a backed-up
# phrase: Settings' Vault button, Vault's setup and the YubiKey explainer,
# then the core's enrolment wizard with its simulated keys (two keys, a PIN
# each), to the overview and the core's key management. Moving money needs a
# funded wallet (the core's minimum deposit is 100,000 satoshis).
appId: com.bitcoinsv.wallet
---
# Settings' Vault button puts Vault in the quick actions
- runFlow:
    when:
      notVisible: Vault
    commands:
      - tapOn: Settings
      - scrollUntilVisible:
          element: Vault button
      - tapOn: Vault button
      - tapOn: Back
- tapOn: Vault
- assertVisible: Connect your YubiKeys
- takeScreenshot: vault-setup
- tapOn: What’s a YubiKey?
- assertVisible: A key for your money
- swipe:
    start: 50%,30%
    end: 50%,95%
- tapOn: Simulated YubiKey
- tapOn: Hold key 1
- tapOn: Set up your vault
# the core's wizard
- tapOn: ".*I understand: only my YubiKeys open this vault.*"
- scrollUntilVisible:
    element: ".*factory-reset or dedicated to Vault.*"
- tapOn: ".*factory-reset or dedicated to Vault.*"
- scrollUntilVisible:
    element: Begin
- tapOn: Begin
- runFlow:
    file: _vault-key.yaml
    env:
      PIN: "482915"
- tapOn: Hold key 2
- tapOn: Add another key
- runFlow:
    file: _vault-key.yaml
    env:
      PIN: "591736"
- tapOn: Finish
- assertVisible: Vault ready
- tapOn: Done
# the overview
- extendedWaitUntil:
    visible: Protected by your YubiKeys
    timeout: 10000
- assertVisible: Move money in
- takeScreenshot: vault-overview
- tapOn: Keys and recovery
- assertVisible: .*MOCK-DEV-1.*
- assertVisible: .*MOCK-DEV-2.*
