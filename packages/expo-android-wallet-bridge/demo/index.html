<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Android bridge demo</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --fg: #14171a;
        --muted: #5b6672;
        --line: #d5dae0;
        --accent: #0a5cff;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #101214;
          --fg: #eceff2;
          --muted: #9aa5b1;
          --line: #2b3036;
          --accent: #5b92ff;
        }
      }
      body {
        margin: 0;
        padding: 16px;
        background: var(--bg);
        color: var(--fg);
        font:
          16px/1.4 -apple-system,
          system-ui,
          sans-serif;
      }
      h1 {
        font-size: 20px;
        margin: 0 0 4px;
      }
      p {
        color: var(--muted);
        margin: 0 0 16px;
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-bottom: 12px;
      }
      button {
        font: inherit;
        padding: 10px 14px;
        border-radius: 10px;
        border: 1px solid var(--line);
        background: transparent;
        color: var(--accent);
      }
      input {
        font: inherit;
        padding: 8px 10px;
        border-radius: 10px;
        border: 1px solid var(--line);
        background: transparent;
        color: var(--fg);
        min-width: 0;
        flex: 1 1 140px;
      }
      pre {
        white-space: pre-wrap;
        word-break: break-all;
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 10px;
        min-height: 120px;
        font-size: 13px;
      }
      h2 {
        font-size: 18px;
        margin: 24px 0 4px;
      }
      h3 {
        font-size: 15px;
        margin: 16px 0 6px;
      }
      #conformance button:disabled {
        opacity: 0.45;
      }
      #cf-report {
        width: 100%;
        min-height: 140px;
        box-sizing: border-box;
        font:
          12px/1.3 ui-monospace,
          monospace;
        color: var(--fg);
        background: transparent;
        border: 1px solid var(--line);
        border-radius: 10px;
        margin-bottom: 12px;
      }
      .cf-card {
        border-top: 1px solid var(--line);
        padding: 8px 0;
      }
      .cf-head,
      .cf-case {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 4.5em 4.5em 3em;
        gap: 6px;
        align-items: center;
        font-size: 14px;
      }
      .cf-head button {
        grid-column: 1 / -1;
        padding: 6px 12px;
        justify-self: start;
      }
      .cf-case {
        font-size: 12px;
        padding: 3px 0 0 8px;
      }
      .cf-id {
        overflow-wrap: anywhere;
      }
      .cf-ms,
      .cf-code,
      .cf-spend,
      .cf-msg {
        color: var(--muted);
        font-size: 12px;
      }
      .cf-spend,
      .cf-msg {
        margin: 4px 0 0;
        overflow-wrap: anywhere;
      }
      .cf-st {
        font-weight: 600;
      }
      .cf-pass {
        color: #1a8f4a;
      }
      .cf-fail {
        color: #d12c2c;
      }
      .cf-skip,
      .cf-run {
        color: #b87500;
      }
      .cf-none {
        color: var(--muted);
      }
    </style>
  </head>
  <body id="demo-root">
    <h1>Android bridge demo</h1>
    <p>Stand-in BRC-185 loopback client for Pixel_9 testing. Open wallet must be a real tap.</p>
    <div class="row">
      <button id="open">Open wallet</button>
      <button id="describe">describe</button>
      <button id="connect">connect</button>
      <button id="disconnect">disconnect</button>
      <button id="permission">Permission</button>
    </div>
    <div class="row">
      <input
        id="port"
        aria-label="First port"
        inputmode="numeric"
        placeholder="First port (3321 to 3384)"
        value="3321"
      />
      <input
        id="timeout"
        aria-label="Attempt timeout in ms"
        inputmode="numeric"
        placeholder="Attempt timeout ms"
        value="3000"
      />
    </div>
    <div class="row">
      <button id="getVersion">getVersion</button>
      <button id="isAuthenticated">isAuthenticated</button>
      <button id="getPublicKey">getPublicKey</button>
    </div>
    <div class="row">
      <input id="wallet" aria-label="Wallet name" placeholder="Wallet (name contains; empty = first)" />
      <input id="description" aria-label="Description" placeholder="Description" value="Demo payment" />
      <input id="satoshis" aria-label="Satoshis" inputmode="numeric" value="1" />
      <button id="createAction">createAction</button>
    </div>
    <pre id="log"></pre>
    <section id="conformance"></section>
    <script src="/demo.js"></script>
  </body>
</html>
