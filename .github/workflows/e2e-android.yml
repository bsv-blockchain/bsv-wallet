name: E2E Android

# Builds a debug harness APK and runs the Maestro flows on an Android emulator.
# The iOS job is separate (e2e-ios.yml) because macOS minutes are much more
# expensive; see TESTING.md.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'e2e/**'
      - 'app/**'
      - 'packages/expo-wallet-toolbox/**'
      - 'packages/expo-android-wallet-bridge/**'
      - 'packages/expo-safari-wallet-bridge/**'
      - 'packages/react-native-*/**'
      - 'eas.json'
      - 'app.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'plugins/**'
      - '.github/workflows/e2e-android.yml'

permissions:
  contents: read

concurrency:
  group: e2e-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android emulator
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.22.1'
          cache: pnpm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ubuntu-latest already has the Android SDK. android-actions/setup-android@v3
      # installs the removed `tools` package and fails before the build starts.
      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          CMDLINE="$(echo "$SDK"/cmdline-tools/*/bin/sdkmanager | awk '{print $1}')"
          if [[ ! -x "$CMDLINE" ]]; then
            echo "sdkmanager not found under $SDK/cmdline-tools" >&2
            ls -la "$SDK" || true
            exit 1
          fi
          # `yes` exits with SIGPIPE once sdkmanager has read enough answers.
          set +o pipefail
          yes | "$CMDLINE" --licenses >/dev/null || true
          set -o pipefail
          "$CMDLINE" --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.1.12297006" \
            "cmake;3.22.1"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Mock broadcaster unit tests
        run: node --test e2e/mock/server.test.mjs

      - name: Prebuild and assemble the harness APK
        env:
          EXPO_PUBLIC_E2E: 'true'
          EXPO_NO_TELEMETRY: '1'
          # The emulator is x86_64. Building the other ABIs only adds time.
          ORG_GRADLE_PROJECT_reactNativeArchitectures: x86_64
        run: |
          npx expo prebuild --platform android --no-install --clean
          cd android && ./gradlew assembleDebug --no-daemon -PreactNativeArchitectures=x86_64

      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Run flows on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            set +e
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            install_status=$?
            if [ "$install_status" -ne 0 ]; then
              mkdir -p e2e/artifacts
              adb logcat -d > e2e/artifacts/logcat.txt || true
              exit "$install_status"
            fi
            bash e2e/scripts/run.sh
            status=$?
            if [ "$status" -ne 0 ]; then
              mkdir -p e2e/artifacts
              adb logcat -d > e2e/artifacts/logcat.txt || true
            fi
            exit "$status"

      - name: Collect device logs
        if: failure()
        run: |
          mkdir -p e2e/artifacts
          adb logcat -d > e2e/artifacts/logcat.txt || true

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-android-failure
          path: |
            e2e/artifacts
            e2e/mock/requests.log
          if-no-files-found: ignore
          retention-days: 14
