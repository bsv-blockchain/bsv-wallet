name: Device end-to-end

# Manual only. Maestro flows in e2e/maestro drive a compiled BSV Wallet
# dev-client. GitHub-hosted Ubuntu cannot produce the iOS binary (that needs
# macOS and Xcode), and an Android emulator job still needs a dev-client APK
# this workflow does not build — native Nitro modules, Firebase and the Expo
# prebuild make a from-source emulator boot a poor default PR check.
#
# To run it once an APK is attached to the workflow (Actions → upload, or a
# previous job's artifact named wallet-apk):
#   gh workflow run e2e-device.yml
#
# Until that artifact exists the job fails on purpose at the download step
# rather than pretending a device run happened. Pull requests do not run this
# workflow. The browser journeys in ci.yml are the required end-to-end gate.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Maestro on Android emulator
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download the dev-client APK
        uses: actions/download-artifact@v4
        with:
          name: wallet-apk
          path: e2e/maestro

      - name: Install Maestro
        run: curl -Ls "https://get.maestro.mobile.dev" | bash

      - name: Run flows
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          script: |
            adb install -r e2e/maestro/*.apk
            export PATH="$PATH:$HOME/.maestro/bin"
            maestro test e2e/maestro
