packages:
  - packages/*

# Expo / React Native: one flat node_modules, as npm laid it out. Native
# autolinking, Metro and the jest mappers keep their root paths.
nodeLinker: hoisted

# The toolbox peers on the local native packages with "*"; take them from the
# workspace, not the registry.
linkWorkspacePackages: true

# One version of each shared @bsv package: the root depends on it through
# `catalog:`, and the overrides pin every transitive copy to the same version.
catalog:
  '@bsv/sdk': '^4.0.1'
  '@bsv/templates': '^2.2.0'
  '@bsv/wallet-toolbox-client': 'npm:@bsv/wallet-toolbox-mobile@^2.15.1'
  '@bsv/wallet-toolbox-mobile': '^2.15.1'
  '@bsv/color-permission-module': '^0.2.0'
  '@bsv/mandala': '^0.5.0'

overrides:
  'minimatch': '^10.2.2'
  'postcss': '^8.5.10'
  'uuid': '^11.1.1'
  'js-yaml': '^4.2.0'
  'react-native': '0.86.3'
  '@react-native/virtualized-lists': '0.86.3'
  '@bsv/sdk': 'catalog:'
  '@bsv/templates': 'catalog:'
  '@bsv/wallet-toolbox-client': 'catalog:'
  '@bsv/wallet-toolbox-mobile': 'catalog:'
  '@bsv/color-permission-module': 'catalog:'
  '@bsv/mandala': 'catalog:'

patchedDependencies:
  '@bsv/sdk@4.0.1': patches/@bsv+sdk+4.0.1.patch
  '@bsv/wallet-toolbox-mobile@2.15.1': patches/@bsv+wallet-toolbox-mobile+2.15.1.patch
  'decode-uri-component@0.2.2': patches/decode-uri-component+0.2.2.patch
  'expo-splash-screen@57.0.9': patches/expo-splash-screen+57.0.9.patch
  'react-native-quick-crypto@0.7.17': patches/react-native-quick-crypto+0.7.17.patch

# pnpm 11 holds back releases younger than its minimum age; these were
# published days before the switch and are already pinned in the lockfile.
minimumReleaseAgeExclude:
  - '@bsv/color-permission-module@0.2.0'
  - '@bsv/mandala@0.5.0'
  - '@bsv/templates@2.2.0'

# Install scripts that npm ran; pnpm blocks them unless listed.
allowBuilds:
  '@firebase/util': true
  protobufjs: true
  unrs-resolver: true
